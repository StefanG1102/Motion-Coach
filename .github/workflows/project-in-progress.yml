name: Project item moved to In Progress

on:
  projects_v2_item:
    types: [edited]

permissions:
  issues: write
  contents: write

jobs:
  start-work:
    if: >
      github.event.changes.field_value != null &&
      github.event.changes.field_value.field_name == 'Status' &&
      github.event.projects_v2_item.field_value.name == 'In progress'

    runs-on: ubuntu-latest

    steps:
      - name: Assign issue to Stefan
        uses: actions/github-script@v7
        with:
          script: |
            const content = context.payload.projects_v2_item.content;

            if (!content || content.type !== 'Issue') {
              core.info('Project item is not an issue.');
              return;
            }

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: content.number,
              assignees: ['StefanG1102']
            });

      - name: Create branch
        uses: actions/github-script@v7
        with:
          script: |
            const content = context.payload.projects_v2_item.content;

            if (!content || content.type !== 'Issue') {
              core.info('Project item is not an issue.');
              return;
            }

            const issueNumber = content.number;
            const issueTitle = content.title;
            const baseBranch = 'main';

            const slug = issueTitle
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-|-$/g, '')
              .substring(0, 50);

            const branchName = `feature/${issueNumber}-${slug}`;

            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${baseBranch}`
            });

            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branchName}`,
                sha: ref.object.sha
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `Branch created: \`${branchName}\``
              });
            } catch (error) {
              if (error.status === 422) {
                core.info(`Branch already exists: ${branchName}`);
              } else {
                throw error;
              }
            }